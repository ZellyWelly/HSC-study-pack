<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zelly — Your exam timetable</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --base:#0D0E12; --lime:#78E83E; --lime-deep:#4FCE2C; --mint:#B4F3AE; --teal:#39E6C4;
    --ink:#F2F4F0; --ink-soft:#9CA39A; --card:#16181D; --card-2:#1B1E24;
    --edge:rgba(242,244,240,.10); --edge-soft:rgba(242,244,240,.06);
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:radial-gradient(1100px 620px at 50% -12%, #13291c 0%, var(--base) 58%);
    color:var(--ink); font-family:var(--sans); min-height:100vh;}
  a{color:inherit;}
  .nav{border-bottom:1px solid var(--edge); background:rgba(13,14,18,.72); backdrop-filter:blur(10px); position:sticky; top:0; z-index:20;}
  .nav-inner{max-width:960px; margin:0 auto; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .wordmark{display:inline-flex; align-items:center; gap:11px; text-decoration:none;}
  .wordmark .dot{width:15px;height:15px;border-radius:50%;
    background:conic-gradient(from 0deg,var(--lime-deep),var(--teal),var(--mint),var(--lime),var(--lime-deep));
    box-shadow:0 0 16px rgba(134,224,30,.6); animation:spin 7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .wm-text{display:flex; flex-direction:column;}
  .wm-name{font-weight:800; letter-spacing:-.02em; font-size:18px; line-height:1;}
  .wm-tag{font-weight:600; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-top:3px;}
  .nav-links{display:flex; align-items:center; gap:20px; font-size:14px; font-weight:600;}
  .nav-links a{text-decoration:none; color:var(--ink-soft); transition:color .15s;}
  .nav-links a:hover{color:var(--ink);}
  .nav-links a.here{color:var(--lime);}
  @media(max-width:560px){ .nav-links{gap:14px; font-size:13px;} .wm-tag{display:none;} }

  .wrap{max-width:960px; margin:0 auto; padding:26px 22px 80px;}
  .eyebrow{display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:11.5px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--lime); background:rgba(120,232,62,.1); border:1px solid rgba(120,232,62,.28);
    padding:7px 13px; border-radius:100px; margin-bottom:16px;}
  h1{font-weight:800; font-size:30px; letter-spacing:-.02em; line-height:1.08; margin-bottom:10px;}
  h1 em{font-style:normal; background:linear-gradient(100deg,var(--lime),var(--teal)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .lead{color:var(--ink-soft); font-size:14.5px; line-height:1.55; margin-bottom:8px; max-width:64ch;}
  .summary{font-size:14px; color:var(--ink); margin:16px 0 4px; font-weight:600;}
  .summary b{color:var(--lime);}

  /* tab bar */
  .xtabs{display:inline-flex; gap:5px; background:var(--card); border:1px solid var(--edge); border-radius:13px; padding:5px; margin:20px 0 6px;}
  .xtab{border:none; background:transparent; color:var(--ink-soft); font-family:inherit; font-weight:800; font-size:14px;
    padding:9px 20px; border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:background .15s,color .15s;}
  .xtab:hover{color:var(--ink);}
  .xtab.active{background:var(--lime); color:#0D0E12;}
  .xtab .tdot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.75;}
  .pane{display:none;}
  .pane.active{display:block;}

  .note{display:flex; gap:10px; align-items:flex-start; background:var(--card-2); border:1px solid var(--edge-soft);
    border-radius:12px; padding:12px 15px; margin:16px 0 4px; font-size:13px; color:var(--ink-soft); line-height:1.5;}
  .note b{color:var(--ink);}

  /* week block (HSC) */
  .week{margin-top:26px;}
  .week-head{display:flex; align-items:baseline; gap:12px; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--edge);}
  .week-head .wk{font-weight:800; font-size:16px; letter-spacing:-.01em;}
  .week-head .wk-range{font-size:12.5px; color:var(--ink-soft); font-weight:600;}
  .week-head .wk-count{margin-left:auto; font-size:12px; font-weight:700; color:var(--teal);}
  .exam-cards{display:flex; flex-direction:column; gap:14px;}

  .ecard{position:relative; background:var(--card); border:1px solid var(--edge); border-radius:16px; padding:16px 16px 15px;
    border-left:4px solid var(--sc,#78E83E); overflow:hidden;}
  .ecard::before{content:""; position:absolute; inset:0; background:var(--sc,#78E83E); opacity:.045; pointer-events:none;}
  .ec-top{display:flex; align-items:center; gap:9px; margin-bottom:9px; position:relative;}
  .ec-tag{font-size:11px; font-weight:800; padding:3px 9px; border-radius:7px; color:#fff; background:var(--sc,#555); white-space:nowrap;}
  .ec-badge{font-size:9.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:100px; border:1px solid;}
  .ec-badge.hsc{color:var(--lime); border-color:rgba(120,232,62,.4); background:rgba(120,232,62,.08);}
  .ec-badge.trials{color:var(--teal); border-color:rgba(57,230,196,.4); background:rgba(57,230,196,.08);}
  .ec-paper{font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}
  .ec-count{margin-left:auto; font-size:11.5px; font-weight:800; color:var(--sc,#78E83E);}
  .ec-count.soon{color:#FF8A93;}
  .ec-name{font-weight:800; font-size:15.5px; line-height:1.2; margin-bottom:8px; position:relative;}
  .ec-when{display:flex; flex-wrap:wrap; gap:8px 14px; font-size:13px; color:var(--ink); margin-bottom:11px; position:relative;}
  .ec-when .day{font-weight:800;}
  .ec-when .time{color:var(--ink-soft); font-weight:600;}
  .ec-chips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:11px; position:relative;}
  .chip{font-size:11px; font-weight:700; padding:4px 9px; border-radius:100px; background:rgba(255,255,255,.05);
    border:1px solid var(--edge); color:var(--ink-soft);}
  .chip b{color:var(--ink); font-weight:800;}
  .ec-format{font-size:12.5px; color:var(--ink-soft); line-height:1.5; position:relative; padding-top:10px; border-top:1px solid var(--edge-soft);}
  .ec-format .fl{color:var(--mint); font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10.5px; display:block; margin-bottom:3px;}

  /* trials input cards */
  .tcards{display:flex; flex-direction:column; gap:14px; margin-top:8px;}
  .tcard{position:relative; background:var(--card); border:1px solid var(--edge); border-radius:16px; padding:16px;
    border-left:4px solid var(--sc,#39E6C4); overflow:hidden;}
  .tcard::before{content:""; position:absolute; inset:0; background:var(--sc,#39E6C4); opacity:.045; pointer-events:none;}
  .tpaper{position:relative; margin-top:12px;}
  .tpaper:first-of-type{margin-top:10px;}
  .tplabel{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--teal); margin-bottom:5px;}
  .tdesc{font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:10px;}
  .tinputs{display:flex; flex-wrap:wrap; gap:10px; position:relative;}
  .tinputs label{display:flex; flex-direction:column; gap:5px; font-size:10.5px; font-weight:800; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-soft);}
  .tinputs input{background:var(--base); border:1px solid var(--edge); border-radius:10px; padding:10px 11px; color:var(--ink);
    font-family:inherit; font-size:14px; outline:none; color-scheme:dark;}
  .tinputs input[type=date]{min-width:150px;}
  .tinputs input[type=time]{min-width:128px;}
  .tinputs input:focus{border-color:rgba(120,232,62,.55);}
  .tcard + .tpaper-sep{}

  .actions{display:flex; gap:12px; margin-top:26px; flex-wrap:wrap;}
  .btn{border-radius:12px; padding:13px 20px; font-family:inherit; font-size:14.5px; font-weight:800; cursor:pointer; border:1px solid transparent; text-decoration:none; display:inline-flex; align-items:center; gap:8px;}
  .btn-primary{background:var(--lime); color:#0D0E12;} .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--edge);} .btn-ghost:hover{border-color:rgba(242,244,240,.28);}
  .foot-src{margin-top:34px; padding-top:18px; border-top:1px solid var(--edge); font-size:12px; color:var(--ink-soft); line-height:1.6;}
  .foot-src a{color:var(--teal); font-weight:700;}
  .empty{background:var(--card); border:1px solid var(--edge); border-radius:16px; padding:28px; text-align:center; color:var(--ink-soft); margin-top:20px; line-height:1.6;}
  .empty a{color:var(--lime); font-weight:700;}
</style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="wordmark" href="index.html"><span class="dot"></span><span class="wm-text"><span class="wm-name">Zelly</span><span class="wm-tag">HSC Study Companion</span></span></a>
      <nav class="nav-links">
        <a href="app.html">Home</a>
        <a href="timetable.html" class="here">Exams</a>
        <a href="start.html?edit=1">Change subjects</a>
      </nav>
    </div>
  </header>

  <div class="wrap">
    <span class="eyebrow">◆ Exam timetable</span>
    <h1>Your <em>exam timetable.</em></h1>
    <p class="lead">Your exams laid out clearly — colour-coded by subject, with a quick overview of what each paper involves so nothing catches you off guard.</p>

    <div id="tabbar"></div>

    <div class="pane" id="pane-trials"></div>
    <div class="pane" id="pane-hsc"></div>

    <div id="pagefoot"></div>
  </div>

<script>
(function(){
  "use strict";

  var NAMES = {
    hms:"Health & Movement Science", bio:"Biology", chem:"Chemistry", phys:"Physics",
    math2:"Mathematics Advanced", matha:"Mathematics Standard 2", bus:"Business Studies",
    legal:"Legal Studies", cafs:"Community & Family Studies", modhist:"Modern History", anchist:"Ancient History",
    sor:"Studies of Religion", eng:"English Advanced", engst:"English Standard", va:"Visual Arts"
  };
  var SUBJ_COLOR = {
    hms:'#2e9e5b', bio:'#2f8f9d', eng:'#3a6ea5', engst:'#3a6ea5', va:'#a1489c',
    chem:'#7c3aed', phys:'#3949ab', math2:'#db2777', matha:'#be123c', bus:'#b8860b',
    legal:'#64748b', cafs:'#4d7c0f', modhist:'#b45309', anchist:'#c2660c', sor:'#9333ea'
  };
  var TAG = { eng:'Eng Adv', engst:'Eng Std', bio:'Biology', chem:'Chemistry', phys:'Physics',
    math2:'Maths Adv', matha:'Maths Std', bus:'Business', legal:'Legal', cafs:'CAFS',
    modhist:'Mod Hist', anchist:'Anc Hist', sor:'SOR', va:'Visual Arts', hms:'HMS' };

  // Official 2026 HSC written exam timetable (triangulated across NESA-sourced timetables).
  var EXAMS = [
    { key:'engst', paper:'Paper 1', date:'2026-10-13', day:'Tuesday', time:'9:50am – 11:30am', reading:'10 min', working:'1 hr 30 min',
      format:'Common Module: Texts and Human Experiences. Section I — short answers on unseen texts (20 marks). Section II — an extended composition (20 marks).' },
    { key:'eng', paper:'Paper 1', date:'2026-10-13', day:'Tuesday', time:'9:50am – 11:30am', reading:'10 min', working:'1 hr 30 min',
      format:'Common Module: Texts and Human Experiences. Section I — short answers on unseen texts (20 marks). Section II — an extended composition (20 marks).' },
    { key:'engst', paper:'Paper 2', date:'2026-10-14', day:'Wednesday', time:'9:25am – 11:30am', reading:'5 min', working:'2 hrs',
      format:'Modules A, B and C — three extended-response sections (20 marks each, 60 total).' },
    { key:'eng', paper:'Paper 2', date:'2026-10-14', day:'Wednesday', time:'9:25am – 11:30am', reading:'5 min', working:'2 hrs',
      format:'Modules A, B and C — three extended-response sections (20 marks each, 60 total).' },
    { key:'modhist', date:'2026-10-16', day:'Friday', time:'9:25am – 12:30pm', reading:'5 min', working:'3 hrs',
      format:'Section I — source-based (Power and Authority). Section II — National Study. Section III — Peace and Conflict. Section IV — Change in the Modern World. 100 marks.' },
    { key:'math2', date:'2026-10-19', day:'Monday', time:'9:20am – 12:30pm', reading:'10 min', working:'3 hrs',
      format:'Section I — 10 multiple-choice (10 marks). Section II — extended-response questions (90 marks). 100 total. (Extension 1 & 2 papers sit on separate days.)' },
    { key:'matha', date:'2026-10-19', day:'Monday', time:'9:20am – 12:00pm', reading:'10 min', working:'2 hrs 30 min',
      format:'Section I — 15 multiple-choice (15 marks). Section II — extended-response questions (85 marks). 100 total.' },
    { key:'bio', date:'2026-10-21', day:'Wednesday', time:'9:25am – 12:30pm', reading:'5 min', working:'3 hrs',
      format:'Section I — 20 multiple-choice (20 marks). Section II — short & extended response (80 marks). 100 total.' },
    { key:'sor', date:'2026-10-22', day:'Thursday', time:'9:25am – 11:00am / 12:30pm', reading:'5 min', working:'SOR I: 1 hr 30 min · SOR II: 3 hrs',
      format:'Studies of Religion I (1 unit) finishes at 11:00am; Studies of Religion II (2 unit) runs to 12:30pm. Short-answer and extended-response sections across your studied religions and religious traditions.' },
    { key:'anchist', date:'2026-10-23', day:'Friday', time:'9:25am – 12:30pm', reading:'5 min', working:'3 hrs',
      format:'Section I — source-based (Investigating Ancient History). Section II — Personalities. Section III — Ancient Societies. Section IV — Historical Periods. 100 marks.' },
    { key:'bus', date:'2026-10-26', day:'Monday', time:'9:25am – 12:30pm', reading:'5 min', working:'3 hrs',
      format:'Section I — 20 multiple-choice. Section II — short answer. Section III — business-report response. Section IV — extended-response essay. 100 marks.' },
    { key:'hms', date:'2026-10-28', day:'Wednesday', time:'9:20am – 12:30pm', reading:'10 min', working:'3 hrs',
      format:'Objective-response, short-answer and extended-response sections across the core and your depth study / collaborative investigation. 100 marks.' },
    { key:'chem', date:'2026-10-30', day:'Friday', time:'9:25am – 12:30pm', reading:'5 min', working:'3 hrs',
      format:'Section I — 20 multiple-choice (20 marks). Section II — short & extended response (80 marks). 100 total.' },
    { key:'va', date:'2026-10-30', day:'Friday', time:'1:55pm – 3:30pm', reading:'5 min', working:'1 hr 30 min',
      format:'Art Criticism and Art History. Section I — short answers on provided material. Section II — an extended-response essay. 50 marks. (Note: an afternoon exam.)' },
    { key:'legal', date:'2026-11-02', day:'Monday', time:'9:25am – 12:30pm', reading:'5 min', working:'3 hrs',
      format:'Section I — 20 multiple-choice (Crime). Section II — short answers (Human Rights). Section III — extended responses on your two options. 100 marks.' },
    { key:'cafs', date:'2026-11-03', day:'Tuesday', time:'9:25am – 12:30pm', reading:'5 min', working:'3 hrs',
      format:'Section I — 20 multiple-choice. Section II — short answer. Section III — extended response. Section IV — option essays. 100 marks.' },
    { key:'phys', date:'2026-11-05', day:'Thursday', time:'9:25am – 12:30pm', reading:'5 min', working:'3 hrs',
      format:'Section I — 20 multiple-choice (20 marks). Section II — short & extended response (80 marks). 100 total.' }
  ];
  var WEEKS = [
    { label:'Week 1', range:'12 – 16 October', start:'2026-10-12', end:'2026-10-18' },
    { label:'Week 2', range:'19 – 23 October', start:'2026-10-19', end:'2026-10-25' },
    { label:'Week 3', range:'26 – 30 October', start:'2026-10-26', end:'2026-11-01' },
    { label:'Week 4', range:'2 – 5 November', start:'2026-11-02', end:'2026-11-08' }
  ];

  // group HSC sessions by subject key (English → 2), preserving order (Paper 1 then Paper 2)
  var BYKEY = {}, KEY_ORDER = [];
  EXAMS.forEach(function(x){ if(!BYKEY[x.key]){ BYKEY[x.key]=[]; KEY_ORDER.push(x.key); } BYKEY[x.key].push(x); });

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function fmtDate(iso){ var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; var p=iso.split("-"); return (+p[2])+" "+m[+p[1]-1]; }
  function shortTag(k){ return TAG[k] || (NAMES[k]||k); }

  var KEY = "hscOnboarding_v1";
  var blob = null; try { blob = JSON.parse(localStorage.getItem(KEY)); } catch(e){ blob = null; }
  var chosen = (blob && Array.isArray(blob.subjects) && blob.subjects.length) ? blob.subjects.slice() : null;
  var examType = blob && blob.examType ? blob.examType : null; // 'hsc' | 'trials' | null

  var paneT = document.getElementById("pane-trials");
  var paneH = document.getElementById("pane-hsc");
  var tabbar = document.getElementById("tabbar");
  var pagefoot = document.getElementById("pagefoot");

  if (!chosen){
    tabbar.innerHTML = "";
    paneH.className = "pane active";
    paneH.innerHTML = '<div class="empty">Once you set up your plan and pick your subjects, your exam timetable will show up here.<br><br><a href="start.html">Set up my plan &rarr;</a></div>';
    return;
  }

  var subjKeys = KEY_ORDER.filter(function(k){ return chosen.indexOf(k) !== -1; });

  // trials tab shown unless the student is studying only for the HSC
  var trialsAllowed = (examType !== "hsc");
  // default: trials-students land on Trials; everyone else on HSC
  var defaultTab = (examType === "trials") ? "trials" : "hsc";

  // ---------- countdown ----------
  function daysUntil(iso){ var p=iso.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); var t=new Date(); t.setHours(0,0,0,0); return Math.round((d.getTime()-t.getTime())/86400000); }
  function countLabel(iso){ var n=daysUntil(iso); if(n<0)return{txt:"done",soon:false}; if(n===0)return{txt:"today",soon:true}; if(n===1)return{txt:"tomorrow",soon:true}; return{txt:n+" days away",soon:n<=7}; }
  function chipHtml(l,v){ return '<span class="chip">'+esc(l)+' <b>'+esc(v)+'</b></span>'; }

  // ========== HSC PANE (read-only, official dates) ==========
  function hscCard(x){
    var col = SUBJ_COLOR[x.key] || '#78E83E';
    var nm = NAMES[x.key] || x.key;
    var cl = countLabel(x.date);
    return '<div class="ecard" style="--sc:'+col+'">' +
      '<div class="ec-top">' +
        '<span class="ec-tag">'+esc(shortTag(x.key))+'</span>' +
        '<span class="ec-badge hsc">HSC</span>' +
        (x.paper ? '<span class="ec-paper">'+esc(x.paper)+'</span>' : '') +
        '<span class="ec-count'+(cl.soon?' soon':'')+'">'+esc(cl.txt)+'</span>' +
      '</div>' +
      '<div class="ec-name">'+esc(nm)+(x.paper?' <span style="color:var(--ink-soft);font-weight:700">· '+esc(x.paper)+'</span>':'')+'</div>' +
      '<div class="ec-when"><span class="day">'+esc(x.day)+' '+fmtDate(x.date)+'</span><span class="time">'+esc(x.time)+'</span></div>' +
      '<div class="ec-chips">'+chipHtml('Reading',x.reading)+chipHtml('Working',x.working)+'</div>' +
      '<div class="ec-format"><span class="fl">What to expect</span>'+esc(x.format)+'</div>' +
    '</div>';
  }
  function renderHsc(){
    var shown = EXAMS.filter(function(x){ return chosen.indexOf(x.key) !== -1; });
    var out = '';
    // summary + clash note
    if (shown.length){
      var first=shown[0], last=shown[shown.length-1];
      out += '<p class="summary">You\'ve got <b>'+shown.length+'</b> HSC '+(shown.length===1?'exam':'exams')+
        ' — from <b>'+esc(first.day)+' '+fmtDate(first.date)+'</b> to <b>'+esc(last.day)+' '+fmtDate(last.date)+'</b>.</p>';
      var byDate={}; shown.forEach(function(x){ (byDate[x.date]=byDate[x.date]||[]).push(x); });
      var clash=Object.keys(byDate).filter(function(d){ return byDate[d].length>1; });
      if (clash.length){
        var names=clash.map(function(d){ return byDate[d].map(function(x){return NAMES[x.key]||x.key;}).join(" & ")+" ("+byDate[d][0].day+" "+fmtDate(d)+")"; }).join("; ");
        out += '<div class="note"><span>⚠️</span><span><b>Two exams share a day:</b> '+esc(names)+'. That\'s normal on the HSC timetable — just something to pace your energy around.</span></div>';
      }
    }
    WEEKS.forEach(function(wk){
      var inWeek = shown.filter(function(x){ return x.date>=wk.start && x.date<=wk.end; });
      if (!inWeek.length) return;
      out += '<div class="week"><div class="week-head"><span class="wk">'+esc(wk.label)+'</span>'+
        '<span class="wk-range">'+esc(wk.range)+'</span>'+
        '<span class="wk-count">'+inWeek.length+' exam'+(inWeek.length>1?'s':'')+'</span></div>'+
        '<div class="exam-cards">'+inWeek.map(hscCard).join("")+'</div></div>';
    });
    paneH.innerHTML = out;
  }

  // ========== TRIALS PANE (editable — student enters school-set dates) ==========
  var TD = (blob.trialDates && typeof blob.trialDates==="object") ? blob.trialDates : {};
  var TT = (blob.trialTimes && typeof blob.trialTimes==="object") ? blob.trialTimes : {};
  function tDateAt(v,i){ if(v==null)return""; if(Array.isArray(v))return v[i]||""; return i===0?v:""; }
  function tTimeAt(v,i){ var o=(v==null)?null:(Array.isArray(v)?v[i]:(i===0?v:null)); o=o||{}; return {start:o.start||"",end:o.end||""}; }

  function trialCard(key){
    var sessions = BYKEY[key] || [{}];
    var multi = sessions.length>1;
    var col = SUBJ_COLOR[key] || '#39E6C4';
    var body = sessions.map(function(s,idx){
      var d=tDateAt(TD[key],idx), t=tTimeAt(TT[key],idx);
      return '<div class="tpaper">'+
        (multi?'<span class="tplabel">'+esc(s.paper||('Paper '+(idx+1)))+'</span>':'')+
        '<div class="tdesc">'+esc(s.format||'')+'</div>'+
        '<div class="tinputs">'+
          '<label>Date<input type="date" class="t-date" data-idx="'+idx+'" value="'+esc(d)+'"></label>'+
          '<label>Start<input type="time" class="t-start" data-idx="'+idx+'" value="'+esc(t.start)+'"></label>'+
          '<label>Finish<input type="time" class="t-end" data-idx="'+idx+'" value="'+esc(t.end)+'"></label>'+
        '</div>'+
      '</div>';
    }).join("");
    return '<div class="tcard" data-key="'+key+'" style="--sc:'+col+'">'+
      '<div class="ec-top"><span class="ec-tag">'+esc(shortTag(key))+'</span><span class="ec-badge trials">Trials</span></div>'+
      '<div class="ec-name">'+esc(NAMES[key]||key)+'</div>'+
      body+
    '</div>';
  }
  function renderTrials(){
    var intro = '<div class="note"><span>📌</span><span>Your school sets your <b>trial</b> dates, so pop them in below — date plus start and finish time. Zelly will lean your study plan toward whichever trial is soonest, without dropping the rest. Leave a subject blank if you don\'t know it yet.</span></div>';
    var cards = '<div class="tcards">'+subjKeys.map(trialCard).join("")+'</div>';
    var actions = '<div class="actions">'+
      '<button type="button" class="btn btn-primary" id="saveTrials">Save &amp; update my plan &rarr;</button>'+
      '<a class="btn btn-ghost" href="app.html">Back to my plan</a>'+
      '</div>';
    paneT.innerHTML = intro + cards + actions;
    document.getElementById("saveTrials").addEventListener("click", saveTrials);
  }
  function saveTrials(){
    var dates={}, times={};
    Array.prototype.forEach.call(paneT.querySelectorAll(".tcard"), function(card){
      var key=card.getAttribute("data-key");
      var multi=(BYKEY[key]||[]).length>1;
      var ds=card.querySelectorAll(".t-date"), ss=card.querySelectorAll(".t-start"), es=card.querySelectorAll(".t-end");
      if (multi){
        var da=[], ta=[];
        Array.prototype.forEach.call(ds,function(el){ da[+el.getAttribute("data-idx")]=el.value; });
        Array.prototype.forEach.call(ss,function(el){ var i=+el.getAttribute("data-idx"); ta[i]=ta[i]||{}; ta[i].start=el.value; });
        Array.prototype.forEach.call(es,function(el){ var i=+el.getAttribute("data-idx"); ta[i]=ta[i]||{}; ta[i].end=el.value; });
        if (da.some(Boolean)) dates[key]=da.map(function(x){return x||"";});
        if (ta.some(function(o){return o&&(o.start||o.end);})) times[key]=ta.map(function(o){return {start:(o&&o.start)||"",end:(o&&o.end)||""};});
      } else {
        var dv=ds[0]?ds[0].value:"", sv=ss[0]?ss[0].value:"", ev=es[0]?es[0].value:"";
        if (dv) dates[key]=dv;
        if (sv||ev) times[key]={start:sv,end:ev};
      }
    });
    // work out whether the plan actually needs rebuilding: weighting only depends on the DATES
    // (not the times), so a times-only edit just saves quietly without a disruptive regenerate.
    function stableDates(o){ var ks=Object.keys(o||{}).sort(); return JSON.stringify(ks.map(function(k){ return [k, o[k]]; })); }
    var wasTrials = (blob.examType === "trials");
    var datesChanged = stableDates(TD) !== stableDates(dates);
    blob.trialDates=dates; blob.trialTimes=times;
    if (!wasTrials) blob.examType="trials"; // entering trial dates ⇒ studying for trials
    try { localStorage.setItem(KEY, JSON.stringify(blob)); } catch(e){}
    // give a quick bit of feedback, then head back to the plan
    var btn = document.getElementById("saveTrials");
    if (btn){ btn.textContent = "Saved ✓"; btn.disabled = true; }
    if (datesChanged || !wasTrials){
      // dates (or the mode) changed → rebuild the plan's weighting. The regen keeps ticked-off progress.
      location.href = "start.html?regen=1";
    } else {
      // nothing that affects the plan changed → just return to the tracker, progress untouched
      location.href = "app.html";
    }
  }

  // ========== tab bar ==========
  function buildTabs(){
    if (!trialsAllowed){ tabbar.innerHTML = ""; return; } // HSC-only student → no tab bar
    tabbar.innerHTML =
      '<div class="xtabs" role="tablist">'+
        '<button type="button" class="xtab" data-pane="trials"><span class="tdot"></span>Trials</button>'+
        '<button type="button" class="xtab" data-pane="hsc"><span class="tdot"></span>HSC</button>'+
      '</div>';
    Array.prototype.forEach.call(tabbar.querySelectorAll(".xtab"), function(b){
      b.addEventListener("click", function(){ activate(b.getAttribute("data-pane")); });
    });
  }
  function activate(which){
    paneT.className = "pane" + (which==="trials"?" active":"");
    paneH.className = "pane" + (which==="hsc"?" active":"");
    Array.prototype.forEach.call(tabbar.querySelectorAll(".xtab"), function(b){
      b.classList.toggle("active", b.getAttribute("data-pane")===which);
    });
    try { localStorage.setItem("hscExamTab", which); } catch(e){}
  }

  // ========== boot ==========
  renderHsc();
  if (trialsAllowed) renderTrials();
  buildTabs();

  // Always honour the default: trials students should see Trials first every time they open Exams.
  activate(trialsAllowed ? defaultTab : "hsc");

  pagefoot.innerHTML =
    '<p class="foot-src">HSC dates &amp; times are the official 2026 NESA written-exam timetable (exams run 13&nbsp;October&nbsp;–&nbsp;5&nbsp;November 2026). '+
    'Reading and working times come from the published session times; format notes are a general guide — always confirm the exact exam specification for your course on the '+
    '<a href="https://www.nsw.gov.au/education-and-training/nesa/key-dates/hsc-written-exam-timetable" target="_blank" rel="noopener">NESA website</a>. '+
    'Trial dates are set by your school.</p>';
})();
</script>
</body>
